name: VPN Gate Monitor (India Only)

on:
  schedule:
    - cron: "0 */6 * * *" # Har 6 ghante mein India servers check karega
  workflow_dispatch:
    inputs:
      max_servers:
        description: "Max servers to test (0 = all India servers)"
        required: false
        default: "0"
      workers:
        description: "Parallel isolated OpenVPN tunnels"
        required: false
        default: "20"

permissions:
  contents: write

concurrency:
  group: vpngate-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: "Fetch > Filter India (IN) > Test > Build fallback_india.ovpn"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenVPN and Python deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openvpn
          python -m pip install --upgrade -q pip
          python -m pip install -q requests pytest

      - name: "Stages 1-5: fetch, import India history, clean, archive"
        shell: bash
        run: |
          mkdir -p logs
          python scripts/fetch.py --data-dir data --archive-dir archive 2>&1 | tee logs/fetch.log

      - name: "Stage 6: test ONLY INDIA (IN) VPNs & build fallback_india.ovpn"
        shell: bash
        run: |
          sudo python3 scripts/test_vpns.py \
            --data-dir data \
            --countries "IN" \
            --workers "${{ github.event.inputs.workers || '20' }}" \
            --max-servers "${{ github.event.inputs.max_servers || '0' }}" \
            2>&1 | tee logs/test.log

      - name: "Stage 7: generate report"
        shell: bash
        env:
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
          GH_EVENT: ${{ github.event_name }}
        run: |
          python scripts/report.py --data-dir data 2>&1 | tee logs/report.log

      - name: Commit and push results (including fallback_india.ovpn)
        env:
          GIT_TERMINAL_PROMPT: 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data archive badges README.md
          [ -f fallback_india.ovpn ] && git add fallback_india.ovpn
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(india-vpn): updated active India servers #${{ github.run_number }} [skip ci]"
            git pull --rebase --autostash || true
            git push || (sleep 5 && git pull --rebase --autostash && git push)
          fi
